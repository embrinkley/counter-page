<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <title>Animated Counter</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #counter {
            font-size: 10rem;
            font-weight: bold;
            color: #4CAF50;
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
  <div id="counter">0</div>

  <script>
    let upto = 36;
    let counts = setInterval(updated, 60);

        function updated() {
            let count = document.getElementById("counter");
            count.innerHTML++;
            if (count.innerHTML >= upto) {
                clearInterval(counts);
                count.innerHTML = upto;
        }
    }
  </script>
</body>
</html>
